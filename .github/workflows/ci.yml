name: Signalling backend checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --prefix src/WhitePad.Signalling
      - run: npm run check --prefix src/WhitePad.Signalling
      - run: npm run test:deploy --prefix src/WhitePad.Signalling
      - run: npm run test:quota --prefix src/WhitePad.Signalling
